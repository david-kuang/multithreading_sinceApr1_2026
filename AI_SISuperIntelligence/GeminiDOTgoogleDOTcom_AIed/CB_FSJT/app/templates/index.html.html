<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Web App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: calc(100vh - 120px); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen font-sans">

    <!-- Auth View -->
    <div id="auth-view" class="flex items-center justify-center flex-1">
        <div class="bg-gray-800 p-8 rounded-lg shadow-md w-96 border border-gray-700">
            <h2 id="auth-title" class="text-2xl font-bold text-center mb-6 text-white">Login to ChatGPT</h2>
            <div id="auth-error" class="hidden mb-4 p-2 bg-red-600 text-white rounded text-sm text-center"></div>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" id="auth-username" required class="w-full px-3 py-2 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full px-3 py-2 bg-gray-700 rounded text-white border border-gray-600 focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full py-2 bg-blue-600 hover:bg-blue-700 font-bold rounded transition">Login</button>
            </form>
            
            <p class="mt-4 text-center text-sm text-gray-400">
                <span id="auth-toggle-text">Don't have an account?</span>
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-blue-400 underline ml-1">Register</button>
            </p>
        </div>
    </div>

    <!-- Main Chat UI View -->
    <div id="chat-view" class="hidden flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-4 flex justify-between items-center border-b border-gray-700">
                <button onclick="createNewConversation()" class="w-full py-2 px-4 bg-emerald-600 hover:bg-emerald-700 rounded text-white font-medium transition">+ New Chat</button>
            </div>
            <div id="conversations-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Conversation items populated via JS -->
            </div>
            <div class="p-4 border-t border-gray-700 flex justify-between items-center">
                <span id="user-display" class="text-sm font-semibold truncate text-gray-300">User</span>
                <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-2 py-1 rounded text-white transition">Logout</button>
            </div>
        </aside>

        <!-- Chat Main View -->
        <main class="flex-1 flex flex-col bg-gray-900">
            <!-- Messages Display Area -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                <div class="text-center text-gray-500 my-auto pt-20">Select or start a new conversation to begin!</div>
            </div>

            <!-- Message Input Form -->
            <div class="p-4 border-t border-gray-800 bg-gray-900">
                <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2 max-w-4xl mx-auto">
                    <input type="text" id="message-input" placeholder="Send a message..." required autocomplete="off"
                           class="flex-1 px-4 py-3 bg-gray-800 text-white rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500">
                    <button type="submit" id="send-btn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition">Send</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        let isLogin = true;
        let token = localStorage.getItem('token') || '';
        let currentConvId = null;
        let currentUsername = localStorage.getItem('username') || '';

        // Initial setup check
        if (token) { showChatView(); }

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? 'Login to ChatGPT' : 'Register Account';
            document.getElementById('auth-submit-btn').innerText = isLogin ? 'Login' : 'Register';
            document.getElementById('auth-toggle-text').innerText = isLogin ? "Don't have an account?" : "Already registered?";
            document.getElementById('auth-toggle-btn').innerText = isLogin ? 'Register' : 'Login';
            document.getElementById('auth-error').classList.add('hidden');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.classList.add('hidden');

            try {
                if (isLogin) {
                    const formData = new URLSearchParams();
                    formData.append('username', username);
                    formData.append('password', password);

                    const res = await fetch('/api/auth/token', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Authentication failed');

                    token = data.access_token;
                    currentUsername = username;
                    localStorage.setItem('token', token);
                    localStorage.setItem('username', currentUsername);
                    showChatView();
                } else {
                    const res = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Registration failed');
                    toggleAuthMode();
                    alert('Account created! Please log in.');
                }
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        }

        function showChatView() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
            document.getElementById('user-display').innerText = currentUsername;
            loadConversations();
        }

        function logout() {
            token = '';
            currentUsername = '';
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('auth-view').classList.remove('hidden');
        }

        async function loadConversations() {
            const res = await fetch('/api/conversations', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 401) return logout();
            const conversations = await res.json();
            const listEl = document.getElementById('conversations-list');
            listEl.innerHTML = '';

            conversations.forEach(c => {
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-2 rounded cursor-pointer ${c.id === currentConvId ? 'bg-gray-700' : 'hover:bg-gray-700/50'}`;
                div.innerHTML = `
                    <span onclick="selectConversation(${c.id})" class="truncate flex-1 text-sm text-gray-200">${escapeHtml(c.title)}</span>
                    <button onclick="deleteConversation(${c.id}, event)" class="text-gray-400 hover:text-red-400 px-1">✕</button>
                `;
                listEl.appendChild(div);
            });
        }

        async function createNewConversation() {
            const res = await fetch('/api/conversations', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const conv = await res.json();
            await loadConversations();
            selectConversation(conv.id);
        }

        async function selectConversation(id) {
            currentConvId = id;
            await loadConversations();

            const res = await fetch(`/api/conversations/${id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const conv = await res.json();
            renderMessages(conv.messages);
        }

        async function deleteConversation(id, e) {
            e.stopPropagation();
            await fetch(`/api/conversations/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (currentConvId === id) {
                currentConvId = null;
                document.getElementById('messages-container').innerHTML = '<div class="text-center text-gray-500 my-auto pt-20">Select or start a new conversation to begin!</div>';
            }
            loadConversations();
        }

        function renderMessages(messages) {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            messages.forEach(m => {
                const isUser = m.role === 'user';
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
                msgDiv.innerHTML = `
                    <div class="max-w-xl p-3 rounded-lg ${isUser ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-200 border border-gray-700'}">
                        <div class="text-xs font-bold mb-1 opacity-75">${isUser ? 'You' : 'Assistant'}</div>
                        <div class="text-sm whitespace-pre-wrap">${escapeHtml(m.content)}</div>
                    </div>
                `;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content) return;

            if (!currentConvId) {
                const res = await fetch('/api/conversations', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const conv = await res.json();
                currentConvId = conv.id;
            }

            input.value = '';
            
            // Optimistically append user message
            const container = document.getElementById('messages-container');
            const tempDiv = document.createElement('div');
            tempDiv.className = 'flex justify-end';
            tempDiv.innerHTML = `
                <div class="max-w-xl p-3 rounded-lg bg-blue-600 text-white">
                    <div class="text-xs font-bold mb-1 opacity-75">You</div>
                    <div class="text-sm whitespace-pre-wrap">${escapeHtml(content)}</div>
                </div>
            `;
            container.appendChild(tempDiv);
            container.scrollTop = container.scrollHeight;

            // Submit to backend API
            const res = await fetch(`/api/conversations/${currentConvId}/messages`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ content })
            });

            if (res.ok) {
                await selectConversation(currentConvId);
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
