<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YinYang迎红 AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 text-center shadow-md">
        <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">
            YinYang迎红 AI Chat
        </h1>
    </header>

    <!-- Chat Messages Window -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold">AI</div>
            <div class="bg-slate-800 rounded-2xl p-4 max-w-md shadow-sm border border-slate-700">
                <p>Hello! How can I help you today?</p>
            </div>
        </div>
    </main>

    <!-- Input Form Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your message here..." 
                autocomplete="off"
                required
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500"
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium transition shadow-lg"
            >
                Send
            </button>
        </form>
    </footer>

    <!-- Frontend Chat Logic -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Append User Message
            appendMessage(message, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Show typing indicator
            const loadingId = appendLoadingIndicator();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await res.json();
                removeLoadingIndicator(loadingId);

                if (res.ok) {
                    appendMessage(data.reply, 'ai');
                } else {
                    appendMessage(`Error: ${data.detail || 'Something went wrong'}`, 'ai');
                }
            } catch (err) {
                removeLoadingIndicator(loadingId);
                appendMessage('Error: Failed to connect to backend server.', 'ai');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            wrapper.innerHTML = `
                <div class="${isUser ? 'bg-emerald-600' : 'bg-indigo-600'} text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm">
                    ${isUser ? 'You' : 'AI'}
                </div>
                <div class="${isUser ? 'bg-indigo-900 border-indigo-700' : 'bg-slate-800 border-slate-700'} rounded-2xl p-4 max-w-md border shadow-sm whitespace-pre-wrap">
                    <p>${escapeHTML(text)}</p>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = `flex items-start space-x-3`;
            wrapper.innerHTML = `
                <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm">AI</div>
                <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 text-slate-400 italic">
                    Thinking...
                </div>
            `;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeLoadingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
