<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT-like Web App</title>
    <style>
        :root {
            --bg-sidebar: #202123;
            --bg-main: #343541;
            --bg-input: #40414f;
            --text-primary: #ececf1;
            --text-secondary: #979aae;
            --border-color: #4d4d4f;
            --accent-color: #10a37f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-main); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
        .sidebar-header { padding: 10px; }
        .new-chat-btn { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 5px; cursor: pointer; text-align: left; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .new-chat-btn:hover { background-color: rgba(255,255,255,0.05); }
        .conversation-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .conversation-item { padding: 10px; border-radius: 5px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-secondary); }
        .conversation-item:hover, .conversation-item.active { background-color: rgba(255,255,255,0.05); color: var(--text-primary); }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        .chat-container { flex: 1; overflow-y: auto; padding-bottom: 120px; }
        .message { padding: 20px; display: flex; justify-content: center; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .message.assistant { background-color: rgba(68, 70, 84, 0.5); }
        .message-inner { max-width: 800px; width: 100%; display: flex; gap: 20px; font-size: 15px; line-height: 1.6; }
        .avatar { width: 30px; height: 30px; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .user .avatar { background-color: #5436da; }
        .assistant .avatar { background-color: var(--accent-color); }
        .message-content { flex: 1; white-space: pre-wrap; }
        .input-container { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(180deg, rgba(53,53,65,0) 0%, var(--bg-main) 50%); display: flex; justify-content: center; }
        .input-box { max-width: 800px; width: 100%; display: flex; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        .input-box textarea { flex: 1; background: transparent; border: none; color: var(--text-primary); resize: none; outline: none; font-size: 15px; max-height: 200px; line-height: 1.5; }
        .send-btn { background: var(--accent-color); border: none; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; align-self: flex-end; }
        .send-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="createNewChat()">+ New chat</button>
        </div>
        <div class="conversation-list" id="conversationList"></div>
    </div>
    <div class="main-content">
        <div class="chat-container" id="chatContainer"></div>
        <div class="input-container">
            <div class="input-box">
                <textarea id="messageInput" rows="1" placeholder="Send a message..." onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <script>
        let currentConversationId = null;

        async function loadConversations() {
            try {
                const res = await fetch('/api/conversations');
                const conversations = await res.json();
                const listEl = document.getElementById('conversationList');
                listEl.innerHTML = '';
                conversations.forEach(c => {
                    const div = document.createElement('div');
                    div.className = `conversation-item ${c.id === currentConversationId ? 'active' : ''}`;
                    div.textContent = c.title;
                    div.onclick = () => selectConversation(c.id);
                    listEl.appendChild(div);
                });
                if (!currentConversationId && conversations.length > 0) {
                    selectConversation(conversations[0].id);
                } else if (!currentConversationId && conversations.length === 0) {
                    createNewChat();
                }
            } catch (err) {
                console.error('Failed to load conversations:', err);
            }
        }

        async function createNewChat() {
            try {
                const res = await fetch('/api/conversations', { method: 'POST' });
                const conversation = await res.json();
                currentConversationId = conversation.id;
                await loadConversations();
                loadMessages(currentConversationId);
            } catch (err) {
                console.error('Failed to create conversation:', err);
            }
        }

        async function selectConversation(id) {
            currentConversationId = id;
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.toggle('active', item.textContent.includes(id));
            });
            loadMessages(id);
            loadConversations();
        }

        async function loadMessages(conversationId) {
            try {
                const res = await fetch(`/api/conversations/${conversationId}/messages`);
                const messages = await res.json();
                const container = document.getElementById('chatContainer');
                container.innerHTML = '';
                messages.forEach(m => appendMessageToDOM(m.role, m.content));
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error('Failed to load messages:', err);
            }
        }

        function appendMessageToDOM(role, content) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `
                <div class="message-inner">
                    <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
                    <div class="message-content">${escapeHTML(content)}</div>
                </div>
            `;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !currentConversationId) return;

            input.value = '';
            appendMessageToDOM('user', content);

            try {
                const res = await fetch(`/api/conversations/${currentConversationId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                const assistantMsg = await res.json();
                appendMessageToDOM(assistantMsg.role, assistantMsg.content);
                loadConversations();
            } catch (err) {
                console.error('Failed to send message:', err);
            }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.onload = loadConversations;
    </script>
</body>
</html>
